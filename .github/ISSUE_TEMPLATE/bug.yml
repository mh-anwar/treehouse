name: Bug report
description: Something broke on your box
labels: [bug]
body:
  - type: input
    id: distro
    attributes:
      label: Distro and version
      placeholder: Ubuntu 24.04 / Omarchy 3.x / Arch
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: treehouse version
      description: Run `git log -1 --oneline` in the folder you installed from, or give the date you installed or last updated.
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: How do friends connect?
      options:
        - Cloudflare sign-in page
        - Tailscale only
        - Not set up yet
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: e.g. install.sh output, `journalctl -u sharedbox-<unit> -n 50`. Remove usernames/IPs you don't want public.
      render: text
