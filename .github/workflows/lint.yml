name: lint
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff (syntax + pyflakes)
        run: uvx ruff check --select E9,F lib/*.py lib/box lib/sharedbox-* tests/
      - name: bash syntax
        run: bash -n install.sh uninstall.sh
      - name: shellcheck
        run: shellcheck -S error install.sh uninstall.sh
      - name: unit tests (stdlib, no box needed)
        run: python3 -m unittest discover -s tests
        timeout-minutes: 5
      - name: gate end-to-end (real sharedbox-gate on loopback, stdlib, ~1s)
        run: python3 tests/e2e_gate.py .
        timeout-minutes: 2
