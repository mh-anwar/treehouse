name: lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff (syntax + pyflakes)
        run: uvx ruff check --select E9,F lib/*.py lib/box lib/sharedbox-* tests/
      - name: bash syntax
        run: bash -n install.sh uninstall.sh
      - name: shellcheck
        run: shellcheck -S error install.sh uninstall.sh
      - name: unit tests (stdlib, no box needed)
        run: python3 -m unittest discover -s tests
        timeout-minutes: 5
      - name: gate end-to-end (real sharedbox-gate on loopback, stdlib, ~1s)
        run: python3 tests/e2e_gate.py .
        timeout-minutes: 2
  install:
    # fresh install, friend, re-install, update from git, uninstall, reinstall in a container booting systemd
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:24.04", "debian:trixie", "archlinux:latest"]
    steps:
      - uses: actions/checkout@v4
      - name: install test (${{ matrix.base }})
        run: tests/container/run.sh "${{ matrix.base }}"
  agents:
    # full install with the coding agents and toolchains, then every advertised tool checked as a friend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: agents test (debian:trixie)
        run: SCENARIO=agents tests/container/run.sh debian:trixie
  t3switch:
    # `box t3 switch`: waits for agents, rolls back a failed start, moves the owner's T3 to sb-t3.service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: t3 switch test (debian:trixie)
        run: SCENARIO=t3switch tests/container/run.sh debian:trixie
