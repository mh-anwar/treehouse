# sharedbox configuration. After editing:
#   sudo sharedbox-admin reapply                 (RAM/process limits)
#   sudo systemctl restart sharedbox-web         (join mode, web port)
# The janitor and `box` pick up everything else on their next run.

# The name people see on pages, emails and broadcasts ("treehouse · <hostname>"). Commands, paths and service
# names stay sharedbox-*.
BRAND=treehouse

# Who can sign up at http://<host>:WEB_PORT/join (Tailscale self-signup): open | closed
# open = the account is created right away (it still requires that you shared the machine with them on
# Tailscale; root re-checks `tailscale whois`). closed = no self-signup. There is no approval queue; the old
# "approve" (or any unknown value) counts as closed. Self-signups must give an email (allowed through
# Cloudflare Access too when PUBLIC_MODE=cloudflare). Unset = open, except with PUBLIC_MODE=cloudflare, where
# unset = closed (invites only). `box invite` ignores JOIN_MODE, but without Cloudflare its message points to
# /join, which then needs open.
#JOIN_MODE=open
MAX_USERS=25

# Your own accounts: shown on the dashboard, never limited or cleaned.
ADMIN_USERS=

# Must be a group sshd allows (AllowGroups). Friends are added to it on signup.
SSH_GROUP=ssh-users
FRIENDS_GROUP=friends
FRIEND_UID_MIN=2000
FRIEND_UID_MAX=2999

WEB_BIND=tailscale
WEB_PORT=8090
# The dashboard only answers to this box's hostname, Tailscale name and IPs (DNS rebinding guard).
# Other names you reach it by, comma-separated (restart sharedbox-web after changing):
WEB_HOSTS=
# The owner's treehouse boxes on this tailnet, name=tailscale-ip, space separated. The same line on every box
# (each finds itself by its own IP). The owner's dashboard shows them all. Set it with `box friends boxes "..."`.
BOXES=
# primary (default): accounts are made here. secondary: copies the primary's accounts (same uid, limits, keys),
# refuses invites. Both boxes trust each other once: sharedbox-admin fed-key here, fed-trust '<line>' there.
BOX_ROLE=primary

# Each friend gets PORT_BLOCK ports starting at PORT_BASE + index*PORT_BLOCK
PORT_BASE=20000
PORT_BLOCK=100

# Shared servers (box shared): bots/services the whole group owns. Code in SHARED_DIR/NAME, editable by
# every friend and admin (group SHARED_GROUP); each runs as SHARED_USER on a port from
# SHARED_PORT_BASE..+SHARED_PORT_COUNT-1. All of them together get SHARED_MEMORY_MAX / SHARED_CPU_QUOTA
# (sudo sharedbox-admin reapply after changing these).
SHARED_DIR=/srv/shared
SHARED_PORT_BASE=19000
SHARED_PORT_COUNT=100
SHARED_MAX=20
SHARED_MEMORY_MAX=4G
SHARED_CPU_QUOTA=200%

# Per-user limits: the same for everyone, your own accounts included (override one friend:
# sharedbox-admin limits NAME KEY=VALUE). No CPU cap: CPU_WEIGHT shares it fairly when several people want it.
CPU_WEIGHT=100
IO_WEIGHT=100
# Dynamic RAM: MEMORY_LOW is everyone's guaranteed share; anyone may use up to MEMORY_MAX (auto = the whole box
# minus MEMORY_RESERVE) while nobody else needs it, and the kernel takes memory back from whoever is above their
# share first. No soft limit (MEMORY_HIGH=infinity): one stalls an account in place instead of freeing memory.
# When memory really runs out (OOM_PRESSURE_LIMIT of the time spent waiting on memory, for OOM_PRESSURE_SECONDS),
# systemd-oomd stops the process group causing it (a container, server, agent session or terminal).
MEMORY_LOW=16G
MEMORY_HIGH=infinity
MEMORY_MAX=auto
MEMORY_RESERVE=3G
MEMORY_SWAP_MAX=1G
OOM_PRESSURE_LIMIT=80%
OOM_PRESSURE_SECONDS=30
TASKS_MAX=2048

# One person, no friends: SOLO=1 turns off the friend-only parts (signups and invites,
# Cloudflare seat alerts). Re-run install.sh after changing it.
SOLO=0

# Disk + cleanup
DISK_BUDGET_GB=40
# Projects are the git repos directly in each home (~/NAME). One is archived (moved to ~/.sharedbox/archive/,
# restorable with `box restore NAME`, deleted ARCHIVE_DAYS later) only when BOTH hold: nothing in it used for
# PROJECT_TTL_DAYS, and it's fully pushed (a remote, a clean tree with no untracked files, every branch pushed, no
# stash). Folders that aren't git repos, and unpushed work, are never archived or deleted. Build outputs
# (node_modules, .venv, target, ...) are only removed when someone is over DISK_BUDGET_GB.
PROJECT_TTL_DAYS=20
CACHE_TTL_DAYS=30
TMP_TTL_DAYS=2
WARN_DAYS=3
ARCHIVE_DAYS=14
OVER_BUDGET_GRACE_HOURS=24
DISK_LOW_FREE_PCT=20
DISK_CRITICAL_FREE_PCT=10

# When Ubuntu installs security updates (package lists are refreshed 30 min earlier). Set it before
# the auto-reboot time so an update that needs a reboot is applied the same night. "off" = Ubuntu's
# default (~06:00-07:00). Applied by install.sh.
# Ignored on Arch/Omarchy: there are no automatic updates there (unattended full upgrades are risky on
# Arch). The weekly health email lists pending updates (needs pacman-contrib) and reboot-required instead.
APT_UPGRADE_TIME=03:00

# Told to agents so they plan for it. Keep in sync with Unattended-Upgrade::Automatic-Reboot-Time
# (/etc/apt/apt.conf.d), which is what actually reboots the box after security updates that need it.
# On Arch nothing reboots automatically except SCHEDULED_REBOOT_DAYS below.
REBOOT_TIME=04:00
# Also reboot on these days at REBOOT_TIME regardless of updates (memory leaks, servers still using
# old libraries). Comma-separated Mon..Sun; empty = only reboot when an update needs it. Applied by install.sh.
# This scheduled reboot waits up to 2 hours while a friend's agent is mid-turn; update reboots never wait.
SCHEDULED_REBOOT_DAYS=Wed,Sun

# A box with no swap at all gets /swap.treehouse (min(8 GB, max(2 GB, RAM/2)), only with plenty of free disk):
# compressed memory (zswap) needs it, and without any swap a memory spike kills programs. 0 = never.
TUNE_SWAP=auto

# ---------- preinstalled tools (sudo sharedbox-tools install) ----------
# Everything friends' agents commonly need, installed system-wide so nobody needs sudo.
# Package lists use Debian names. On Arch/Omarchy they are translated to pacman names (gh -> github-cli,
# build-essential -> base-devel, fd-find -> fd, ...; see DEB_TO_ARCH in /usr/lib/sharedbox/sbdistro.py)
# and installed with `pacman -S --needed` (never -Sy alone, never AUR). To choose the Arch packages
# yourself, set TOOLS_PACMAN (replaces TOOLS_APT there) and/or TOOLS_PACMAN_BROWSER (replaces
# TOOLS_APT_BROWSER), in pacman names. Both are ignored on Debian/Ubuntu.
TOOLS_APT=git gh tmux curl build-essential python3-venv python3-pip pipx ripgrep fd-find jq unzip zip sqlite3 htop nodejs npm golang-go rustup
# AI coding agents + T3 Code (web UI, `box t3`) from npm, updated nightly (~5 AM) for everyone. Each version is kept in
# /opt/sharedbox/agents (installed with pnpm to share files between versions); /usr/local/bin has a shim
# per command. (opencode v2 is @opencode/cli on npm; the
# old opencode-ai package stopped at v1 and is mapped to it automatically.)
TOOLS_NPM=@anthropic-ai/claude-code @openai/codex @opencode/cli t3
TOOLS_UV=1
# System libraries for headless Chrome/Playwright/Puppeteer (agents testing web UIs)
TOOLS_BROWSER_DEPS=1
TOOLS_APT_BROWSER=libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libasound2t64 libatspi2.0-0t64 libgbm1 libxkbcommon0 libpango-1.0-0 libcairo2 libcups2t64 fonts-liberation xvfb
TOOLS_PACMAN=
TOOLS_PACMAN_BROWSER=
# Android SDK for APK builds (JDK 21 + cmdline-tools + platform-tools + latest platforms/build-tools).
# Setting this to 1 accepts the Android SDK license on your behalf. Uses ~3G of disk.
TOOLS_ANDROID=0
ANDROID_SDK_ROOT=/opt/android-sdk
ANDROID_PLATFORMS=3

# ---------- friends' package requests (box request install PKG) ----------
# yes = install a requested system package right away when it's in the distro's repos, not installed yet,
# matches none of REQUEST_DENY (globs; also checked against every package it would pull in) and pulls in at
# most REQUEST_MAX_DEPS new packages (REQUEST_DAILY_LIMIT auto-installs per friend per day). Anything else
# (and every free-text request) is emailed to you, with Approve / Done / Decline on your dashboard.
REQUEST_AUTO_INSTALL=yes
REQUEST_DENY=docker* containerd* runc lxc* lxd* incus* libvirt* virtualbox* snapd flatpak postfix* exim* sendmail* opensmtpd* nmap masscan zmap hydra* medusa john hashcat aircrack-ng ettercap* bettercap* sqlmap nikto metasploit* tcpdump wireshark* tshark dsniff macchanger xmrig* cpuminer* ethminer* tor torsocks proxychains* firmware* linux-firmware*
# REQUEST_NEVER (globs, also checked against every dependency) is never installed on request, even for
# REQUEST_OPEN_USERS; the request is closed with the reason. You can still approve one by hand.
REQUEST_NEVER=sudo doas polkit* pkexec openssh-server linux linux-lts linux-zen linux-hardened linux-image* linux-headers* linux-modules* kernel* grub* systemd systemd-* libpam* shadow passwd login apparmor* selinux* sssd* ufw iptables* nftables firewalld network-manager* netplan* tailscale* cloudflared wireguard* openvpn* cron cron-* cronie at
# Temporarily open requests for some users (e.g. a hackathon): they skip REQUEST_DENY, REQUEST_MAX_DEPS and
# REQUEST_DAILY_LIMIT (never REQUEST_NEVER) until REQUEST_OPEN_UNTIL ("YYYY-MM-DD HH:MM" local; empty = no end).
REQUEST_OPEN_USERS=
REQUEST_OPEN_UNTIL=
REQUEST_MAX_DEPS=500
REQUEST_DAILY_LIMIT=200

# ---------- health email (sharedbox-health) ----------
# Weekly report (resources, stability, who used the box, red-team audit) + urgent alerts.
# Gmail: turn on 2-step verification, create an app password at https://myaccount.google.com/apppasswords,
# then: sudo install -m 600 /dev/stdin /etc/sharedbox/smtp-password   (paste it, Enter, Ctrl-D)
MAIL_TO=
# defaults to MAIL_TO's first address (Gmail requires sending as yourself)
SMTP_USER=
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
# systemd OnCalendar day + time. Applied by install.sh.
HEALTH_REPORT_TIME=Mon 09:00

# ---------- public front door (sharedbox-gate) ----------
# Lets friends in with nothing but a browser (phones too): no Tailscale account or share invite for them.
# PUBLIC_MODE=cloudflare is the only public mode. Every request verifies a Cloudflare Access JWT.
# Set up with: sudo bash /usr/share/sharedbox/cloudflare-setup.sh
# Then: box invite --email friend@example.com
# Empty PUBLIC_URL or any other PUBLIC_MODE disables the gate, including legacy Funnel settings.
# The private Tailscale dashboard on WEB_PORT and whois identity still work independently.
PUBLIC_URL=
GATE_PORT=8091
# Lifetime of optional one-time signup invites (--no-create); Cloudflare owns login sessions.
INVITE_DAYS=7
# `invite` creates the friend's account right away. Without --username it picks the name itself:
#   email = from the friend's email (sam@example.com -> sam) or the --note, digits appended if taken
#   lotr  = the first free Lord of the Rings name (frodo, samwise, merry, aragorn, ...), then frodo2, ...
AUTO_USERNAMES=email
PUBLIC_MODE=
# ---- PUBLIC_MODE=cloudflare (written by `sharedbox-admin cloudflare setup`; edit only if you know why) ----
# your own login emails: always allowed through Cloudflare Access, never removed from its allow list
CF_OWNER_EMAILS=
# empty = found automatically when the API token sees exactly one account
CF_ACCOUNT_ID=
CF_TEAM_DOMAIN=
CF_ACCESS_AUD=
CF_TUNNEL_ID=
CF_ACCESS_APP_ID=
CF_ACCESS_POLICY_ID=
# how long a Cloudflare login lasts before the email code is asked again
CF_SESSION_HOURS=720
# SSH through Cloudflare, for friends' own laptops (`ssh treehouse` via `cloudflared access ssh`; no VPN).
# Empty = picked by `sharedbox-admin cloudflare setup|ssh` (<first label>-ssh.<rest>, covered by Cloudflare's
# free certificate) and written here; set a hostname first to choose it, or "off". Same allow list as the site.
SSH_HOST=
CF_SSH_APP_ID=
