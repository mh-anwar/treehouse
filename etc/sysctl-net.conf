# treehouse (sharedbox): network tuning, installed as /etc/sysctl.d/60-sharedbox-net.conf. Safe at any time (no
# network restart; existing connections keep working). Delete the file and reboot to go back to the defaults.

# The Cloudflare tunnel (cloudflared) runs over QUIC, which asks for ~7 MB socket buffers and is held back
# (fewer bytes in flight, slower pages and downloads through the public site) when the cap is lower (default 4 MB)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# T3's live connection pauses between messages; by default TCP drops back to a slow start after every pause,
# so the next reply starts slow. Keep the speed it had (T3 app over Tailscale, SSH, git push)
net.ipv4.tcp_slow_start_after_idle = 0
# Small send queue for interactive streams: a big transfer doesn't delay the next chat message
net.ipv4.tcp_notsent_lowat = 131072
# Find the right packet size when a path silently drops big ones (common through tunnels such as Tailscale's)
net.ipv4.tcp_mtu_probing = 1

# BBR: steadier throughput than the default (cubic) on Wi-Fi and phone links with some packet loss
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
