# treehouse (sharedbox): a frozen box restarts by itself, installed as /etc/sysctl.d/60-sharedbox-nofreeze.conf.
# Owners often can't reach the machine to press the power button. Safe at any time: nothing changes until the
# kernel is already stuck. Every line here is also checked by `box tune` (sharedbox-tune check). The hardware
# watchdog (sharedbox-tune apply) covers the freezes the kernel itself can't notice.

# After a kernel panic, reboot 10 seconds later instead of hanging forever (the default 0 never reboots).
kernel.panic = 10

# A kernel bug ("oops") usually leaves the box half-broken: panic, and so reboot, instead.
kernel.panic_on_oops = 1

# A CPU stuck in the kernel for 20+ seconds (soft lockup): panic and reboot instead of staying frozen.
kernel.softlockup_panic = 1

# A CPU not even taking interrupts (hard lockup, caught by the NMI watchdog): panic and reboot.
kernel.hardlockup_panic = 1

# Prefer dropping file cache to swapping out programs, so a busy box stays responsive (the default 60 swaps
# agents' memory out early; zswap still catches what does get swapped).
vm.swappiness = 10

# Not set on purpose: kernel.hung_task_panic. A slow or flaky disk can stall a program for minutes without the
# box being frozen; panicking then would reboot a box that would have recovered.
