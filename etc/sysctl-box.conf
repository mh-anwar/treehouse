# treehouse (sharedbox): general box tuning, installed as /etc/sysctl.d/60-sharedbox-box.conf. Safe at any time.
# Every line here is also checked by `box tune` (sharedbox-tune check).

# File watchers (dev servers, test runners, editors, agents, T3) each take an inotify instance; the default
# of 128 per account runs out with a few agents and dev servers, and tools then fail with confusing
# "too many open files" / ENOSPC errors. Memory is only used for watches actually in use.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576
